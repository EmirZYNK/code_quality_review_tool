[project]
name = "quality-studio"
version = "2.0.0"
description = "Static, read-only quality analysis for Python source"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
quality-studio = "quality_studio.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "B", "S", "PERF", "SIM"]
ignore = ["S101"]  # assert is used in tests only

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"quality_studio/ground_truth.py" = ["E501"]
"quality_studio/benchmark.py" = ["S603", "S607"]
"quality_studio/external.py" = ["S603", "S607"]
